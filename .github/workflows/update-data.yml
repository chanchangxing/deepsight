name: Update market breadth data

"on":
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild the complete history from 2025-01-01
        type: boolean
        default: false
  schedule:
    - cron: "35 7 * * 1-5"
    - cron: "5 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Update market data
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            python scripts/update_market_data.py --full
          else
            python scripts/update_market_data.py
          fi

      - name: Validate published data
        run: python -m pytest tests/data -v

      - name: Commit published data when it changed
        run: |
          if [ -z "$(git status --porcelain -- public/data data)" ]; then
            echo "No published data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/data data
          git commit -m "data: update market breadth"
          git push
